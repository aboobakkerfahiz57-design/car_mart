<style>

*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.hidden{display:none!important}.app{min-height:100vh}.top{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:20}.brand{display:flex;align-items:center;gap:12px}.brand img{width:42px;height:42px;object-fit:contain;border-radius:8px}.brand strong{font-size:19px}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:2px}.top-right{display:flex;align-items:center;gap:10px}.role{background:#111;color:#fff;border-radius:999px;padding:7px 11px;font-size:12px}.layout{display:flex;min-height:calc(100vh - 64px)}aside{width:245px;background:#111;color:#fff;padding:18px 12px;position:sticky;top:64px;height:calc(100vh - 64px);overflow:auto}.side-title{font-size:11px;color:#9ca3af;text-transform:uppercase;letter-spacing:.12em;padding:8px 11px}.nav-btn{width:100%;border:0;background:transparent;color:#ddd;text-align:left;padding:11px 12px;border-radius:9px;margin:2px 0;font-weight:600}.nav-btn:hover,.nav-btn.active{background:#242424;color:#fff}.nav-btn.active{box-shadow:inset 3px 0 var(--red)}.main{flex:1;padding:26px;min-width:0}.page-head{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;margin-bottom:20px}.page-head h1{margin:0;font-size:27px}.page-head p{margin:5px 0 0;color:var(--muted)}.btn{border:1px solid #d7d7d7;background:#fff;border-radius:8px;padding:10px 14px;font-weight:700}.btn:hover{filter:brightness(.98)}.btn-primary{background:var(--red);border-color:var(--red);color:#fff}.btn-dark{background:#111;color:#fff;border-color:#111}.btn-danger{background:#fee2e2;color:#991b1b;border-color:#fecaca}.btn-green{background:#15803d;color:#fff;border-color:#15803d}.btn-small{padding:7px 10px;font-size:12px}.toolbar{display:flex;gap:9px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:15px}.toolbar-left,.toolbar-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.search{min-width:240px}.field,.search,textarea,select,input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=tel],input[type=url],input[type=file]{width:100%;border:1px solid #d9d9d9;border-radius:8px;padding:10px 11px;background:#fff;outline:none}.field:focus,.search:focus,textarea:focus,select:focus,input:focus{border-color:#999;box-shadow:0 0 0 3px rgba(215,25,32,.08)}textarea{min-height:90px;resize:vertical}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px}.stat .label{font-size:11px;color:var(--muted);font-weight:800;letter-spacing:.08em}.stat .value{font-size:28px;font-weight:800;margin-top:7px}.stat .note{font-size:12px;color:var(--muted);margin-top:4px}.stat.admin{border-top:3px solid var(--red)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.full{grid-column:1/-1}.form-field label{display:block;font-size:12px;font-weight:800;margin:0 0 6px}.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px}.table{width:100%;border-collapse:collapse;background:#fff;min-width:850px}.table th,.table td{padding:11px 12px;border-bottom:1px solid #eee;text-align:left;font-size:13px;vertical-align:top}.table th{background:#fafafa;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#555}.table tr:last-child td{border-bottom:0}.badge{display:inline-block;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:800;background:#eee}.badge.available,.badge.completed,.badge.paid,.badge.given{background:#dcfce7;color:#166534}.badge.pending,.badge.new{background:#fef3c7;color:#92400e}.badge.sold,.badge.closed{background:#fee2e2;color:#991b1b}.badge.in_progress,.badge.partial{background:#dbeafe;color:#1e40af}.module-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.module-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer}.module-card:hover{border-color:#bbb;transform:translateY(-1px)}.module-card b{display:block}.module-card span{font-size:12px;color:var(--muted);display:block;margin-top:5px}.notice{padding:12px 14px;border-radius:9px;background:#f8fafc;border:1px solid #e2e8f0;margin:10px 0}.notice-danger{background:#fff1f2;border-color:#fecdd3;color:#9f1239}.notice-ok{background:#f0fdf4;border-color:#bbf7d0;color:#166534}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#111 0,#202020 50%,#111 100%);padding:20px}.login-card{width:min(430px,100%);background:#fff;border-radius:16px;padding:30px;box-shadow:0 20px 70px rgba(0,0,0,.35)}.login-brand{text-align:center}.login-brand img{width:80px;height:80px;object-fit:contain;border-radius:12px}.login-brand h1{margin:10px 0 3px}.login-brand p{color:var(--muted);margin:0 0 24px}.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.58);display:grid;place-items:center;padding:20px;z-index:100}.modal{width:min(980px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:14px}.modal-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.modal-head h2{margin:0;font-size:19px}.modal-body{padding:20px}.close{border:0;background:#f2f2f2;border-radius:8px;width:34px;height:34px}.vehicle-imgs{display:flex;gap:7px;flex-wrap:wrap}.thumb{width:82px;height:62px;object-fit:cover;border-radius:7px;border:1px solid #ddd}.empty{text-align:center;padding:35px;color:var(--muted)}.loading{text-align:center;padding:30px;color:var(--muted)}.section-title{margin:0 0 12px;font-size:16px}.metric-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.metric{border:1px solid var(--line);border-radius:10px;padding:13px}.metric small{color:var(--muted)}.metric strong{display:block;font-size:20px;margin-top:4px}.print-sheet{background:#fff;color:#111;padding:30px;max-width:800px;margin:auto}.signature-box{height:110px;border:1px dashed #aaa;border-radius:8px;background:#fff;position:relative}.signature-box canvas{width:100%;height:100%;touch-action:none}.signature-label{font-size:11px;color:#666;margin-top:4px}.drop{border:1px dashed #bbb;padding:12px;border-radius:8px;background:#fafafa}.login-error{color:#b91c1c;font-size:13px;margin:10px 0}.danger-text{color:#991b1b}.invoice-actions{display:flex;gap:8px;flex-wrap:wrap}.status-dot{font-weight:800}.mobile-menu{display:none}
@media(max-width:1050px){aside{width:210px}.stats{grid-template-columns:repeat(2,1fr)}.module-cards{grid-template-columns:repeat(2,1fr)}}

body{background:#fff}
.top,aside,.page-head,#app>header,.no-print{display:none!important}

body.handover-printing #carMartPrintTarget{position:static!important;width:100%!important;max-width:none!important;margin:0!important;padding:28px!important}
}

<body>
<div id="loginView" class="login">
  <div class="login-card">
    <div class="login-brand">
      <img src="../carmart-logo.jpeg" alt="Car Mart">
      <h1>CAR MART</h1>
      <p>Production Management Portal</p>
    </div>
    <form id="loginForm">
      <div class="form-field"><label>Email</label><input id="loginEmail" type="email" autocomplete="username" required></div>
      <div class="form-field" style="margin-top:12px"><label>Password</label><input id="loginPassword" type="password" autocomplete="current-password" required></div>
      <div id="loginError" class="login-error hidden"></div>
      <button class="btn btn-primary" style="width:100%;margin-top:16px" id="loginBtn">Sign in →</button>
    </form>
  </div>
</div>

<div id="app" class="app hidden">
<header class="top">
  <div class="brand">
    <button class="btn btn-small mobile-menu" id="mobileMenu">☰</button>
    <img src="../carmart-logo.jpeg" alt="Car Mart">
    <div><strong>CAR MART</strong><small>Used Cars & Commercial Vehicles</small></div>
  </div>
  <div class="top-right">
    <span class="role" id="roleBadge">—</span>
    <span class="user-email" id="topEmail"></span>
    <button class="btn btn-small" id="changePasswordBtn">Change Password</button>
    <button class="btn btn-small" id="logoutBtn">Logout</button>
  </div>
</header>
<div class="layout">
<aside id="sidebar">
  <div class="side-title">Workspace</div>
  <button class="nav-btn active" data-module="dashboard">Dashboard</button>
  <button class="nav-btn" data-module="vehicles">Vehicles</button>
  <button class="nav-btn" data-module="customers">Customers</button>
  <button class="nav-btn" data-module="enquiries">Enquiries</button>
  <button class="nav-btn" data-module="sales">Sales</button>
  <button class="nav-btn" data-module="documents">Documents</button>
  <button class="nav-btn" data-module="transfers">Transfers</button>
  <button class="nav-btn" data-module="handover">Handover</button>
  <div class="side-title admin-only">Management</div>
  <button class="nav-btn admin-only" data-module="expenses">Expenses</button>
  <button class="nav-btn admin-only" data-module="reports">Reports</button>
  <button class="nav-btn admin-only" data-module="users">Staff & Users</button>
  <button class="nav-btn admin-only" data-module="purchase">Purchase Cost</button>
  <button class="nav-btn admin-only" data-module="payments">Payments</button>
</aside>
<main class="main">
  <div class="page-head">
    <div><h1 id="pageTitle">Dashboard</h1><p id="pageDescription">Live Car Mart business overview.</p></div>
    <div id="pageActions"></div>
  </div>
  <section id="dashboardView"></section>
  <section id="moduleView" class="hidden">
    <div id="moduleContent"></div>
  </section>
</main>
</div>
</div>

<div id="modalBackdrop" class="modal-backdrop hidden">
  <div class="modal">
    <div class="modal-head"><h2 id="modalTitle">Car Mart</h2><button class="close" id="modalClose">×</button></div>
    <div id="modalBody" class="modal-body"></div>
  </div>
</div>

<script>
/* ============================================================

   Keep your EXISTING Supabase publishable key unchanged.
   ============================================================ */
const SUPABASE_URL = "https://qiszsikrapggloylbcvm.supabase.co";

/* IMPORTANT:
   Paste/keep the SAME publishable key already used by your
   current working Car Mart public/admin file. Do not use a
   service_role key in this browser file.
*/
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_BelaUeHyL-CmGL-SKGtN9w_0UdZVCKL";

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

let currentUser = null;
let currentProfile = null;
let activeModule = "dashboard";

const $ = id => document.getElementById(id);
const today = () => new Date().toISOString().slice(0,10);
const esc = v => String(v ?? "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
const money = v => "₹" + new Intl.NumberFormat("en-IN",{maximumFractionDigits:2}).format(Number(v)||0);
const fmt = v => new Intl.NumberFormat("en-IN").format(Number(v)||0);
const roleLabel = r => ({admin:"Admin",staff:"Staff",salesman:"Salesman"}[r]||r||"User");
const isAdmin = () => currentProfile?.role === "admin";
const isStaff = () => ["admin","staff","salesman"].includes(currentProfile?.role);

function toast(message,error=false){
  const n=document.createElement("div");
  n.className="notice "+(error?"notice-danger":"notice-ok");
  n.style.cssText="position:fixed;right:18px;bottom:18px;z-index:200;max-width:420px;box-shadow:0 10px 30px rgba(0,0,0,.15)";
  n.textContent=message; document.body.appendChild(n);
  setTimeout(()=>n.remove(),4200);
}
function showLogin(){ $("loginView").classList.remove("hidden"); $("app").classList.add("hidden"); }
function showApp(){ $("loginView").classList.add("hidden"); $("app").classList.remove("hidden"); }
function openModal(title,body){
  $("modalTitle").textContent=title; $("modalBody").innerHTML=body; $("modalBackdrop").classList.remove("hidden");
}
function closeModal(){ $("modalBackdrop").classList.add("hidden"); $("modalBody").innerHTML=""; }
$("modalClose").onclick=closeModal;
$("modalBackdrop").addEventListener("click",e=>{if(e.target===$("modalBackdrop"))closeModal()});

function applyRoleUI(){
  document.querySelectorAll(".admin-only").forEach(el=>el.style.display=isAdmin()?"":"none");
  $("roleBadge").textContent=roleLabel(currentProfile.role);
  $("topEmail").textContent=currentUser.email;
}

async function getRows(table, select="*"){
  const {data,error}=await sb.from(table).select(select);
  if(error) throw error;
  return data||[];
}
async function getOne(table,id,select="*"){
  const {data,error}=await sb.from(table).select(select).eq("id",id).single();
  if(error) throw error;
  return data;
}
async function countRows(table,filter){
  let q=sb.from(table).select("*",{count:"exact",head:true});
  if(filter) q=filter(q);
  const {count,error}=await q;
  if(error) throw error;
  return count||0;
}
async function upload(bucket,path,file){
  const {error}=await sb.storage.from(bucket).upload(path,file,{upsert:false,contentType:file.type||undefined});
  if(error) throw error;
  return path;
}
async function signedUrl(bucket,path,seconds=600){
  if(!path)return null;
  const {data,error}=await sb.storage.from(bucket).createSignedUrl(path,seconds);
  if(error) throw error;
  return data?.signedUrl||null;
}
async function profile(){
  const {data,error}=await sb.from("profiles").select("id,email,full_name,phone,role,is_active").eq("id",currentUser.id).single();
  if(error) throw new Error("Authenticated, but the Car Mart profile could not be loaded.");
  if(!data.is_active) throw new Error("This Car Mart account is inactive.");
  currentProfile=data;
}
function yearOptions(){
  const y=new Date().getFullYear();
  return Array.from({length:35},(_,i)=>y+1-i).map(x=>`<option value="${x}">${x}</option>`).join("");
}

/* ---------- DASHBOARD ---------- */
async function loadDashboard(){
  $("pageTitle").textContent="Dashboard";
  $("pageDescription").textContent="Live Car Mart business overview.";
  $("pageActions").innerHTML="";
  const [vehicles,customers,enquiries,sales,docs,transfers,handovers]=await Promise.all([
    countRows("vehicles",q=>q.eq("status","available")),
    countRows("customers"),countRows("enquiries"),countRows("sales"),
    countRows("sale_documents"),countRows("transfer_records"),countRows("handover_records")
  ]);
  let adminHtml="";
  if(isAdmin()){
    const [expenses,allVehicles,saleRows,finRows,expenseRows]=await Promise.all([
      countRows("expense_records"),getRows("vehicles","id,brand,model,registration_number,status"),
      getRows("sales","id,sale_date,grand_total"),
      getRows("sale_financials","sale_id,purchase_cost,commission"),
      getRows("expense_records","id,vehicle_id,sale_id,amount,expense_date")
    ]);
    const revenue=saleRows.reduce((a,x)=>a+Number(x.grand_total||0),0);
    const investment=finRows.reduce((a,x)=>a+Number(x.purchase_cost||0),0);
    const commission=finRows.reduce((a,x)=>a+Number(x.commission||0),0);
    const exp=expenseRows.reduce((a,x)=>a+Number(x.amount||0),0);
    const profit=revenue-investment-commission-exp;
    adminHtml=`<div class="card admin">
      <h3 class="section-title">Management Financial Area</h3>
      <div class="metric-row">
        <div class="metric"><small>Sales Revenue</small><strong>${money(revenue)}</strong></div>
        <div class="metric"><small>Stock Investment</small><strong>${money(investment)}</strong></div>
        <div class="metric"><small>Expenses</small><strong>${money(exp)}</strong></div>
        <div class="metric"><small>Net Profit</small><strong>${money(profit)}</strong></div>
      </div>
      <p style="color:var(--muted);font-size:12px;margin-bottom:0">Profit = Grand Total − Purchase Cost − Commission − Expenses.</p>
    </div>`;
  }
  $("dashboardView").innerHTML=`
    <div class="stats">
      <div class="stat"><div class="label">AVAILABLE VEHICLES</div><div class="value">${vehicles}</div><div class="note">Live inventory</div></div>
      <div class="stat"><div class="label">CUSTOMERS</div><div class="value">${customers}</div><div class="note">Customer records</div></div>
      <div class="stat"><div class="label">ENQUIRIES</div><div class="value">${enquiries}</div><div class="note">Website/business enquiries</div></div>
      <div class="stat"><div class="label">SALES</div><div class="value">${sales}</div><div class="note">Recorded sales</div></div>
      <div class="stat"><div class="label">DOCUMENTS</div><div class="value">${docs}</div><div class="note">Sale documents</div></div>
      <div class="stat"><div class="label">TRANSFERS</div><div class="value">${transfers}</div><div class="note">RC / insurance</div></div>
      <div class="stat"><div class="label">HANDOVERS</div><div class="value">${handovers}</div><div class="note">Delivery records</div></div>
      ${isAdmin()?`<div class="stat admin"><div class="label">EXPENSE RECORDS</div><div class="value">${await countRows("expense_records")}</div><div class="note">Admin only</div></div>`:""}
    </div>
    ${adminHtml}
    <div class="card">
      <h3 class="section-title">Car Mart Operations</h3>
      <p style="color:var(--muted)">Complete lifecycle: inventory → customer → enquiry → sale → documents → transfer → handover.</p>
      <div class="module-cards">
        ${[
          ["vehicles","Vehicles","Cars and Goods / Commercial Vehicles"],
          ["customers","Customers","Customer records and ID proof photos"],
          ["enquiries","Enquiries","Website enquiries and follow-ups"],
          ["sales","Sales","Sales, sold vehicles and payments"],
          ["documents","Documents","Sale and customer documents"],
          ["transfers","Transfers","RC and insurance workflow"],
          ["handover","Handover","Final delivery checklist"],
          ...(isAdmin()?[["expenses","Expenses","Admin-only business expenses"],["reports","Reports","Admin-only financial reports"],["users","Staff & Users","Role management"]]:[])
        ].map(x=>`<div class="module-card" data-module="${x[0]}"><b>${x[1]}</b><span>${x[2]}</span></div>`).join("")}
      </div>
    </div>`;
  $("dashboardView").querySelectorAll("[data-module]").forEach(x=>x.onclick=()=>openModule(x.dataset.module));
}

/* ---------- VEHICLES ---------- */
async function renderVehicles(){
  const cats=await getRows("vehicle_categories","id,name,slug");
  const rows=await sb.from("vehicles").select("*,vehicle_categories(name,slug)").order("created_at",{ascending:false}).then(r=>{if(r.error)throw r.error;return r.data||[]});
  $("moduleContent").innerHTML=`
  <div class="toolbar"><div class="toolbar-left"><input id="vehicleSearch" class="search" placeholder="Search brand, model, registration, code…"></div><button class="btn btn-primary" id="addVehicle">+ Add Vehicle</button></div>
  <div id="vehicleTable"></div>`;
  const render=()=>{
    const t=($("vehicleSearch").value||"").toLowerCase();
    const data=rows.filter(v=>[v.brand,v.model,v.variant,v.registration_number,v.vehicle_code,v.fuel_type,v.colour].join(" ").toLowerCase().includes(t));
    $("vehicleTable").innerHTML=data.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Vehicle</th><th>Category</th><th>Code / Registration</th><th>Year</th><th>KM</th><th>Selling Price</th><th>Status</th><th>Actions</th></tr></thead><tbody>${data.map(v=>`<tr>
      <td><b>${esc([v.brand,v.model,v.variant].filter(Boolean).join(" "))}</b><br><small>${esc(v.fuel_type||"")} · ${esc(v.transmission||"")} · ${esc(v.colour||"")}</small></td>
      <td>${esc(v.vehicle_categories?.name||"")}</td><td>${esc(v.vehicle_code||"—")}<br>${esc(v.registration_number||"—")}</td>
      <td>${esc(v.registration_year||v.manufacturing_year||"—")}</td><td>${fmt(v.mileage_km)} km</td><td>${money(v.selling_price)}</td>
      <td><span class="badge ${esc(v.status)}">${esc(v.status)}</span></td>
      <td><button class="btn btn-small" onclick="vehicleDetails('${v.id}')">View</button> <button class="btn btn-small" onclick="editVehicle('${v.id}')">Edit</button></td>
    </tr>`).join("")}</tbody></table></div>`:`<div class="empty">No vehicles found.</div>`;
  };
  $("vehicleSearch").oninput=render;render();$("addVehicle").onclick=()=>vehicleForm();
}

async function nextVehicleCode(){
  const {data,error}=await sb.from("vehicles").select("vehicle_code");
  if(error)throw error;
  let max=0;(data||[]).forEach(v=>{const m=String(v.vehicle_code||"").match(/^CM-(\d+)$/i);if(m)max=Math.max(max,Number(m[1]));});
  return `CM-${String(max+1).padStart(3,"0")}`;
}

async function vehicleForm(id=null){
  const cats=await getRows("vehicle_categories","id,name,slug");
  let v=id?await getOne("vehicles",id):{};
  if(!id) v.vehicle_code=await nextVehicleCode();
  let fin=isAdmin()&&id?(await sb.from("vehicle_financials").select("*").eq("vehicle_id",id).maybeSingle()).data||{}:{};
  const images=id?await sb.from("vehicle_images").select("id,vehicle_id,storage_path,is_cover,display_order").eq("vehicle_id",id).then(r=>r.data||[]):[]; 
  openModal(id?"Edit Vehicle":"Add Vehicle",`
  <form id="vehicleForm" class="form-grid">
    <div class="form-field"><label>Category *</label><select name="category_id" required>${cats.map(c=>`<option value="${c.id}" ${v.category_id===c.id?"selected":""}>${esc(c.name)}</option>`).join("")}</select></div>

async function reviewSale(fd,vehicles){

    const docTypes=["RC","Insurance","ID Proof","Sale Agreement","Invoice","Car Mart Paperwork","Transfer Document","RTO Documents","Service Records","Pollution Certificate"];for(const type of docTypes){await sb.from("sale_documents").insert({sale_id:saleId,vehicle_id:vehicle.id,customer_id:customer.id,document_type:type,status:"pending",created_by:currentUser.id,notes:"Auto-created from sale. Upload when received."})}

async function expenseForm(){

  const lines=[{work_type:"Paint",amount:"",description:""}];const draw=()=>{$("expenseLines").innerHTML=lines.map((l,i)=>`<div class="card" style="padding:12px"><div class="form-grid"><div class="form-field"><label>Work Type</label><select data-line="${i}" data-key="work_type">${EXPENSE_WORK_TYPES.map(x=>`<option ${l.work_type===x?"selected":""}>${x}</option>`).join("")}</select></div><div class="form-field"><label>Amount *</label><input data-line="${i}" data-key="amount" type="number" min="0" step=".01" value="${esc(l.amount)}"></div><div class="form-field full"><label>Work Description</label><input data-line="${i}" data-key="description" value="${esc(l.description)}" placeholder="e.g. full body paint"></div></div>${i?`<button type="button" class="btn btn-small btn-danger" data-remove="${i}">Remove</button>`:""}</div>`).join("");document.querySelectorAll("#expenseLines [data-key]").forEach(el=>el.oninput=()=>{lines[Number(el.dataset.line)][el.dataset.key]=el.value});document.querySelectorAll("#expenseLines [data-remove]").forEach(el=>el.onclick=()=>{lines.splice(Number(el.dataset.remove),1);draw()})};draw();$("addExpenseLine").onclick=()=>{lines.push({work_type:"General Service",amount:"",description:""});draw()};

async function renderReports(){

async function runReport(){
  const from=$("reportFrom").value,to=$("reportTo").value;
  const sales=await sb.from("sales").select("*").gte("sale_date",from).lte("sale_date",to).order("sale_date").then(r=>r.data||[]);
  const ids=sales.map(s=>s.id);let fin=[],exp=[];
  if(ids.length){fin=await sb.from("sale_financials").select("*").in("sale_id",ids).then(r=>r.data||[]);exp=await sb.from("expense_records").select("*").or(ids.map(id=>`sale_id.eq.${id}`).join(",")).then(r=>r.data||[]).catch(()=>[])}
  const revenue=sales.reduce((a,x)=>a+Number(x.grand_total||0),0),investment=fin.reduce((a,x)=>a+Number(x.purchase_cost||0),0),commission=fin.reduce((a,x)=>a+Number(x.commission||0),0),expenses=exp.reduce((a,x)=>a+Number(x.amount||0),0),profit=revenue-investment-commission-expenses;
  $("reportResult").innerHTML=`<div class="metric-row"><div class="metric"><small>Sold Vehicles</small><strong>${sales.length}</strong></div><div class="metric"><small>Revenue</small><strong>${money(revenue)}</strong></div><div class="metric"><small>Expenses</small><strong>${money(expenses)}</strong></div><div class="metric"><small>Net Profit</small><strong>${money(profit)}</strong></div></div><div class="card" style="margin-top:15px"><h3 class="section-title">Sales in selected period</h3><div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Sale Number</th><th>Grand Total</th><th>Purchase Cost</th><th>Commission</th><th>Profit</th></tr></thead><tbody>${sales.map(s=>{const f=fin.find(x=>x.sale_id===s.id)||{};const ex=exp.filter(x=>x.sale_id===s.id).reduce((a,x)=>a+Number(x.amount||0),0);return `<tr><td>${esc(s.sale_date)}</td><td>${esc(s.sale_number)}</td><td>${money(s.grand_total)}</td><td>${money(f.purchase_cost)}</td><td>${money(f.commission)}</td><td>${money(Number(s.grand_total)-Number(f.purchase_cost||0)-Number(f.commission||0)-ex)}</td></tr>`}).join("")||`<tr><td colspan="6">No sales in this period.</td></tr>`}</tbody></table></div></div>`;
}

      d.setFont("helvetica","normal"); d.setFontSize(7); d.setTextColor(...muted); d.text(label,x+4,yy+6);
      d.setFont("helvetica","bold"); d.setFontSize(9); d.setTextColor(...ink);
      const val=String(value||"—"); d.text(val.length>42?val.slice(0,42)+"…":val,x+4,yy+13);
    };
    box(left,y,58,20,"SALE DATE",s.sale_date);
    box(left+62,y,58,20,"CUSTOMER",c.name);
    box(left+124,y,58,20,"MOBILE",c.phone);
    y+=24;
    box(left,y,58,20,"REGISTRATION",v.registration_number||"—");
    box(left+62,y,58,20,"VEHICLE CODE",v.vehicle_code||"—");
    box(left+124,y,58,20,"KM",fmt(v.mileage_km));
    y+=24;
    box(left,y,88,20,"VEHICLE",[v.brand,v.model,v.variant].filter(Boolean).join(" "));
    box(left+94,y,88,20,"ADDRESS",c.address||"—");
    y+=28;

    d.setFont("helvetica","bold"); d.setFontSize(10); d.setTextColor(...ink);
    d.text("BILL SUMMARY",left,y);
    y+=7;
    const row=(label,value,bold=false)=>{
      d.setDrawColor(...line); d.line(left,y,right,y);
      d.setFont("helvetica",bold?"bold":"normal"); d.setFontSize(9); d.setTextColor(...ink);
      d.text(label,left+3,y+6); d.text(String(value||"—"),right-3,y+6,{align:"right"});
      y+=9;
    };
    row("Sale Amount",money(s.sale_amount));
    row("Discount",`${s.discount_percent||0}%`);
    row("Other Charges",money(s.other_charges));
    row("Grand Total",money(s.grand_total),true);
    row("Amount Paid",money(paid));
    row("Balance",money(balance),true);
    row("Payment Status",String(s.payment_status||"pending").toUpperCase(),true);

    y+=12;
    d.setDrawColor(...line);
    d.line(left,y,left+50,y); d.line(left+66,y,left+116,y); d.line(left+132,y,right,y);
    d.setFont("helvetica","normal"); d.setFontSize(8); d.setTextColor(...muted);
    d.text("Customer Signature",left,y+7);
    d.text("Authorized Signature",left+66,y+7);
    d.text("Car Mart Seal / Stamp",left+132,y+7);

    d.setFontSize(8); d.setTextColor(...muted);
    d.text("Thank you for choosing Car Mart.",left,282);
    d.setFillColor(...red); d.rect(0,292,pageW,5,"F");
    d.save(`Car-Mart-Invoice-${inv?.invoice_number||s.sale_number}.pdf`);
  }catch(e){toast(e.message,true)}
};
window.printInvoice=async id=>{try{const {s,v,c,inv,paid,balance}=await invoiceData(id);const el=document.createElement("div");el.className="print-sheet";el.innerHTML=`<div style="display:flex;justify-content:space-between;gap:20px"><div><h1 style="margin:0">CAR MART</h1><div>Used Cars & Commercial Vehicles</div><div>Mittothu Colony, NH:66, Hosabettu, Surathkal, Mangaluru, Karnataka 575019</div><div>090365 43444</div></div><div><h2>SALES INVOICE / BILL</h2><b>${esc(inv?.invoice_number||s.sale_number)}</b></div></div><hr><div class="grid3"><div class="metric"><small>Sale Date</small><strong>${esc(s.sale_date)}</strong></div><div class="metric"><small>Customer</small><strong>${esc(c.name)}</strong><small>${esc(c.phone)}</small></div><div class="metric"><small>Address</small><strong>${esc(c.address||"—")}</strong></div><div class="metric"><small>Vehicle</small><strong>${esc([v.brand,v.model,v.variant].filter(Boolean).join(" "))}</strong><small>${esc(v.registration_number||"—")}</small></div><div class="metric"><small>Vehicle Code</small><strong>${esc(v.vehicle_code||"—")}</strong></div><div class="metric"><small>KM</small><strong>${fmt(v.mileage_km)}</strong></div><div class="metric"><small>Sale Amount</small><strong>${money(s.sale_amount)}</strong></div><div class="metric"><small>Discount</small><strong>${s.discount_percent||0}%</strong></div><div class="metric"><small>Other Charges</small><strong>${money(s.other_charges)}</strong></div><div class="metric"><small>Grand Total</small><strong>${money(s.grand_total)}</strong></div><div class="metric"><small>Amount Paid</small><strong>${money(paid)}</strong></div><div class="metric"><small>Balance</small><strong>${money(balance)}</strong></div></div><div style="margin-top:65px;display:flex;justify-content:space-between;gap:20px"><span>Customer Signature<br><br>________________</span><span>Authorized Signature<br><br>________________</span><span>Car Mart Seal / Stamp<br><br>________________</span></div><p style="margin-top:30px;font-size:11px">Thank you for choosing Car Mart.</p>`;document.body.appendChild(el);window.print();setTimeout(()=>el.remove(),700)}catch(e){toast(e.message,true)}};

/* ---------- MODULE ROUTER ---------- */
const descriptions={vehicles:"Cars and Goods / Commercial Vehicles.",customers:"Customer records and collected document photos.",enquiries:"Website enquiries and follow-ups.",sales:"Sales, sold vehicles and payment status.",documents:"Sale and vehicle documents.",transfers:"RC and insurance transfer workflow.",handover:"Final vehicle handover and signatures.",expenses:"Admin-only refurbishment and business expenses.",reports:"Admin-only business and profit reporting.",users:"Admin-only Staff and Salesman profile management.",purchase:"Admin-only vehicle purchase costs.",payments:"Admin-only payment and collection records."};

async function openModule(m){
  if(m==="dashboard"){activeModule=m;document.querySelectorAll(".nav-btn").forEach(x=>x.classList.toggle("active",x.dataset.module===m));$("moduleView").classList.add("hidden");$("dashboardView").classList.remove("hidden");await loadDashboard();return}
  if(["expenses","reports","users","purchase","payments"].includes(m)&&!isAdmin()){toast("Admin access required.",true);return}
  activeModule=m;$("pageTitle").textContent=m==="reports"?"Reports & Analysis":m==="users"?"Staff & Users":m==="purchase"?"Purchase Cost":m==="payments"?"Payments & Collections":m[0].toUpperCase()+m.slice(1);$("pageDescription").textContent=descriptions[m]||"Car Mart production module.";document.querySelectorAll(".nav-btn").forEach(x=>x.classList.toggle("active",x.dataset.module===m));$("dashboardView").classList.add("hidden");$("moduleView").classList.remove("hidden");$("moduleContent").innerHTML='<div class="loading">Loading…</div>';
  const fn={vehicles:renderVehicles,customers:renderCustomers,enquiries:renderEnquiries,sales:renderSales,documents:renderDocuments,transfers:renderTransfers,handover:renderHandover,expenses:renderExpenses,reports:renderReports,users:renderUsers,purchase:renderPurchase,payments:renderPayments}[m];
  try{await fn()}catch(e){$("moduleContent").innerHTML=`<div class="notice notice-danger"><b>Could not load ${esc(m)}.</b><br>${esc(e.message)}</div>`}
}
document.querySelectorAll(".nav-btn").forEach(x=>x.onclick=()=>openModule(x.dataset.module));
$("mobileMenu").onclick=()=>$("sidebar").style.display=$("sidebar").style.display==="block"?"none":"block";

$("loginForm").onsubmit=async e=>{
  e.preventDefault();$("loginError").classList.add("hidden");$("loginBtn").disabled=true;$("loginBtn").textContent="Signing in…";
  try{const {data,error}=await sb.auth.signInWithPassword({email:$("loginEmail").value.trim(),password:$("loginPassword").value});if(error)throw error;currentUser=data.user;await profile();applyRoleUI();showApp();await loadDashboard()}catch(err){$("loginError").textContent=err.message||"Login failed.";$("loginError").classList.remove("hidden")}finally{$("loginBtn").disabled=false;$("loginBtn").textContent="Sign in →"}
};
$("logoutBtn").onclick=async()=>{await sb.auth.signOut();currentUser=null;currentProfile=null;showLogin()};
$("changePasswordBtn").onclick=()=>openModal("Change Password",`<form id="passwordForm"><div class="form-field"><label>New Password</label><input name="password" type="password" minlength="8" required></div><div class="actions" style="margin-top:14px"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary">Change Password</button></div></form>`);
$("modalBackdrop").addEventListener("submit",async e=>{if(e.target.id!=="passwordForm")return;e.preventDefault();try{const p=new FormData(e.target).get("password");const {error}=await sb.auth.updateUser({password:p});if(error)throw error;closeModal();toast("Password changed successfully.")}catch(x){toast(x.message,true)}});

sb.auth.onAuthStateChange((event,session)=>{if(event==="SIGNED_OUT"){currentUser=null;currentProfile=null;showLogin()}});
(async()=>{try{const {data}=await sb.auth.getSession();if(!data.session){showLogin();return}currentUser=data.session.user;await profile();applyRoleUI();showApp();await loadDashboard()}catch(e){console.error(e);showLogin()}})();
</script>
